<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AiDoIt unified routing workflow</title>
  <desc id="desc">Providers and models connect through AiDoIt to Codex, Claude and DeepSeek Harness</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0284C7"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#64748B" flood-opacity=".2"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" fill="#0F172A" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">One clear path from providers to developer tools and Harness</text>
  <text x="600" y="82" text-anchor="middle" fill="#64748B" font-family="Segoe UI,Arial,sans-serif" font-size="15">Auto-detect · Manage centrally · Route intelligently · Restore anytime</text>
