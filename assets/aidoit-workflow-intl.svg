    <g transform="translate(95 187)"><rect width="220" height="62" rx="16" fill="#FFF" stroke="#CBD5E1"/><circle cx="34" cy="31" r="11" fill="#A78BFA"/><text x="58" y="37" fill="#0F172A" font-size="18" font-weight="650">Third-party API</text></g>
    <g transform="translate(95 259)"><rect width="220" height="62" rx="16" fill="#FFF" stroke="#CBD5E1"/><circle cx="34" cy="31" r="11" fill="#34D399"/><text x="58" y="37" fill="#0F172A" font-size="18" font-weight="650">Self-hosted Service</text></g>
    <g transform="translate(470 130)"><rect width="260" height="176" rx="28" fill="url(#core)"/><text x="130" y="67" text-anchor="middle" fill="#FFF" font-size="34" font-weight="800">AiDoIt</text><text x="130" y="101" text-anchor="middle" fill="#EDE9FE" font-size="16">Provider &amp; Model Hub</text><rect x="42" y="124" width="176" height="32" rx="16" fill="#FFF" fill-opacity=".16"/><text x="130" y="146" text-anchor="middle" fill="#FFF" font-size="14" font-weight="650">Smart routing · Local config</text></g>
    <g transform="translate(885 115)"><rect width="220" height="62" rx="16" fill="#FFF" stroke="#CBD5E1"/><circle cx="34" cy="31" r="11" fill="#0EA5E9"/><text x="58" y="37" fill="#0F172A" font-size="18" font-weight="650">Codex / ChatGPT</text></g>
